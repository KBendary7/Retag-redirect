<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Retag Catalogue</title>
</head>
<body>
  <div id="password-section">
    <h2>Enter Password</h2>
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
    <p id="password-error" style="color: red;"></p>
  </div>

  <div id="link-section" style="display: none;">
    <h2>Set Link Expiration Time</h2>
    <label for="hours">Hours:</label>
    <input type="number" id="hours" min="0" placeholder="e.g., 1">
    <label for="minutes">Minutes:</label>
    <input type="number" id="minutes" min="0" max="59" placeholder="e.g., 30">
    <button onclick="generateLink()">Generate Link</button>
    <p id="generated-link"></p>
  </div>

  <script>
    const correctPassword = "retag"; // Change to your actual password

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === correctPassword) {
        document.getElementById("password-section").style.display = "none";
        document.getElementById("link-section").style.display = "block";
      } else {
        document.getElementById("password-error").innerText = "Incorrect password.";
      }
    }

    function generateLink() {
      const hours = parseInt(document.getElementById("hours").value) || 0;
      const minutes = parseInt(document.getElementById("minutes").value) || 0;
      const totalMinutes = hours * 60 + minutes;

      if (totalMinutes <= 0) {
        alert("Please enter a valid duration.");
        return;
      }

      const expirationTime = Date.now() + totalMinutes * 60000;
      const link = `https://kbendary7.github.io/Retag-redirect/?expires=${expirationTime}`;
      document.getElementById("generated-link").innerHTML = `
        <a href="${link}" target="_blank">${link}</a><br>
        <small>This link will be valid for ${hours}h ${minutes}m.</small>
      `;
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      if (params.has('expires')) {
        const expires = parseInt(params.get('expires'));
        if (Date.now() < expires) {
          window.location.href = "https://sites.google.com/view/retagcatalogue/home";
        } else {
          window.location.href = "https://sites.google.com/view/retagcatalogue/home/expired";
        }
      }
    };
  </script>
</body>
</html>
